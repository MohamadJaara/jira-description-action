name: "test -> build -> update lib if needed"
on:
  pull_request:

permissions:
  contents: read # required for actions/checkout to read workflow sources
  actions: read # required for reading workflow metadata

concurrency:
  group: pr-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: Workflow security analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to read workflow sources
      actions: read # required for zizmor online audits
      security-events: write # required for SARIF upload
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run zizmor
        id: zizmor
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          inputs: .github/workflows/pr-test.yml
          version: 1.26.1
          persona: pedantic
          min-severity: informational
          min-confidence: low
          config: .github/zizmor.yml

      - name: Fail if zizmor reported findings
        env:
          sarifFilePath: ${{ steps.zizmor.outputs.output-file }}
        run: |
          findingsCount="$(jq '[.runs[].results[]] | length' "$sarifFilePath")"
          echo "zizmor findings: $findingsCount"
          test "$findingsCount" -eq 0

  build-test:
    name: Build and test
    needs: [workflow-security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: "install"
        run: npm ci --production

      - name: "test"
        run: npm run test

      - name: "build"
        run: npm run build
