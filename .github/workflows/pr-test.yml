name: "test -> build -> update lib if needed"
on:
  pull_request:

permissions:
  contents: read # required for actions/checkout to read workflow sources
  actions: read # required for reading workflow metadata

concurrency:
  group: pr-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: Workflow security analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to read workflow sources
      actions: read # required for zizmor online audits
      security-events: write # required for SARIF upload
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run zizmor
        id: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .github/workflows/pr-test.yml
          version: 1.26.1
          persona: pedantic
          min-severity: informational
          min-confidence: low
          config: .github/zizmor.yml

      - name: Fail if zizmor reported findings
        env:
          sarifFilePath: ${{ steps.zizmor.outputs.output-file }}
        run: |
          findingsCount="$(jq '[.runs[].results[]] | length' "$sarifFilePath")"
          echo "zizmor findings: $findingsCount"
          test "$findingsCount" -eq 0

  build-test:
    name: Build and test
    needs: [workflow-security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: "install"
        # Jest's Babel 7 syntax plugins must resolve separately from Babel 8.
        run: |
          npm ci --strict-peer-deps
          npm ls @babel/core --all

      - name: "test"
        run: npm run test

      - name: "build"
        run: npm run build
