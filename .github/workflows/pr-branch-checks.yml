name: "test -> build -> update lib if needed"
on:
  push:
    branches:
      - 'master'
      - 'add-release'
    tags:
      - '!**'

permissions:
  contents: read # required for actions/checkout to read workflow sources
  actions: read # required for reading workflow metadata

concurrency:
  group: pr-branch-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: Workflow security analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to read workflow sources
      actions: read # required for zizmor online audits
      security-events: write # required for SARIF upload
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run zizmor
        id: zizmor
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          inputs: .github/workflows/pr-branch-checks.yml
          version: 1.26.1
          persona: pedantic
          min-severity: informational
          min-confidence: low
          config: .github/zizmor.yml

      - name: Fail if zizmor reported findings
        env:
          sarifFilePath: ${{ steps.zizmor.outputs.output-file }}
        run: |
          findingsCount="$(jq '[.runs[].results[]] | length' "$sarifFilePath")"
          echo "zizmor findings: $findingsCount"
          test "$findingsCount" -eq 0

  build-test:
    name: Build, test, and release
    needs: [workflow-security]
    runs-on: ubuntu-latest
    permissions:
      contents: write # required for release-it to push the release commit and tag
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true # required for release-it to push the release commit and tag
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: "install"
        run: npm ci

      - name: "test"
        run: npm run test

      - name: "build"
        run: npm run build

      - name: "check if build has changed"
        if: success()
        id: has-changes
        run: |
          echo "LIB_DIFF=$(git diff --stat --name-only  -- lib)"  >> $GITHUB_ENV

      - name: "Commit files"
        if: ${{ env.LIB_DIFF }}
        run: |
          git config --local user.email "buildaction@bot.bot"
          git config --local user.name "Build action bot"
          git commit -m "chore: build action" -a

      - name: release
        run: npm run release
